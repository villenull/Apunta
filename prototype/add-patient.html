<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add patient</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <div class="topbar">
    <a href="patients.html" class="back">
      <svg class="icon" style="width:16px;height:16px" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </a>
  </div>
  <div class="content">
    <h2 style="margin-bottom:6px">Add patient</h2>
    <p class="muted" style="margin-bottom:20px">Just enough to organize her notes.</p>

    <div class="card">
      <div class="field">
        <label class="label">Name</label>
        <input type="text" placeholder="e.g. John Smith">
      </div>
      <div class="field" style="margin-bottom:0">
        <label class="label">Identifier (optional)</label>
        <input type="text" placeholder="Internal reference, chart number, etc.">
      </div>
    </div>

    <a href="patients.html" class="btn btn-primary btn-block" style="margin-top:20px">Add patient</a>
  </div>
</div>
</body>
</html>
