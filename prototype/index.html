<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Practice Notes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <div class="content" style="display:flex;flex-direction:column;justify-content:center;flex:1">
    <div style="text-align:center;margin-bottom:32px">
      <svg class="mark" viewBox="0 0 24 24" fill="none" style="width:32px;height:32px;margin:0 auto 10px">
        <path d="M2 12c1-3 2-4 3-2s1 5 3 3 1-6 3-3 1 5 3 2" stroke="#1F6F63" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M14 12h8" stroke="#1F6F63" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <h1>Practice Notes</h1>
      <p class="muted" style="margin-top:6px">Turn scribbles and recordings into structured notes.</p>
    </div>

    <div class="card">
      <div id="login-view">
        <div class="stack">
          <div class="field">
            <label class="label">Email</label>
            <input type="email" placeholder="you@practice.com">
          </div>
          <div class="field" style="margin-bottom:4px">
            <label class="label">Password</label>
            <input type="password" placeholder="••••••••">
          </div>
          <a href="patients.html" class="btn btn-primary btn-block">Log in</a>
          <p class="small" style="text-align:center;color:var(--text-secondary)">
            New here? <a href="#" onclick="toggle();return false;" style="color:var(--accent);font-weight:500">Create an account</a>
          </p>
        </div>
      </div>

      <div id="signup-view" style="display:none">
        <div class="stack">
          <div class="field">
            <label class="label">Email</label>
            <input type="email" placeholder="you@practice.com">
          </div>
          <div class="field" style="margin-bottom:4px">
            <label class="label">Password</label>
            <input type="password" placeholder="Choose a password">
          </div>
          <a href="onboarding-format.html" class="btn btn-primary btn-block">Create account</a>
          <p class="small" style="text-align:center;color:var(--text-secondary)">
            Already have an account? <a href="#" onclick="toggle();return false;" style="color:var(--accent);font-weight:500">Log in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
function toggle(){
  const l = document.getElementById('login-view');
  const s = document.getElementById('signup-view');
  l.style.display = l.style.display === 'none' ? 'block' : 'none';
  s.style.display = s.style.display === 'none' ? 'block' : 'none';
}
</script>
</body>
</html>
