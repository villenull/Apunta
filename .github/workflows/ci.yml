name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything in CI runs against the deterministic fake AI providers.
  APUNTA_FAKE_AI: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      # The eval's own positive control. Fake mode does not measure the model —
      # it measures whether the scorer can still see a fabrication at all. A
      # blind harness and a clean model produce the same table, so this step
      # fails when the canned notes stop tripping F1, F6 and H4.
      - name: Eval harness self-check
        run: npm run eval -- --fake --runs 1 > /dev/null

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        # The report is diagnostic only; an unavailable artifact service must
        # not turn an otherwise green validation run red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # P3.3's Rust shell. fmt, clippy and test only — the same three the v2 L2 suite
  # names. It deliberately does **not** build an AppImage: bundling is P5.4's job
  # and needs the full P3.1 runtime beside it.
  #
  # The GTK and WebKitGTK **development** packages are required here, not only for
  # bundling. `tauri`'s default features pull in `tauri-runtime-wry` → `wry` →
  # `gtk` / `webkit2gtk-sys`, and `webkit2gtk-sys`'s build script calls
  # `process::exit(1)` when `pkg-config` cannot find the system library. So
  # `cargo clippy` and `cargo test` cannot even *compile* without them: only
  # `cargo fmt --check`, which never builds, would pass. The earlier version of
  # this job said the packages were a packaging prerequisite and carried no
  # install step, so its clippy and test steps could never have run.
  #
  # The package names are A03's own ("Ubuntu archive via `apt`"), run inside CI
  # only. Nothing here touches the owner's machine.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      # Tauri 2's documented Linux prerequisites for Debian/Ubuntu, minus the
      # pieces this crate does not link (`librsvg2-dev` is a bundling-time need
      # for P5.4, `patchelf` likewise). `libssl-dev` and `pkg-config` are already
      # present on the image.
      - name: Install the GTK and WebKitGTK development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # The image ships Rust and rustup; only the two components are missing, and
      # they come from the toolchain already installed rather than from a
      # third-party action fetched at run time.
      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      # `tauri-build` refuses to compile when a path named in
      # `tauri.conf.json`'s `bundle.resources` does not exist, and that mapping
      # points at P3.1's `build/linux-resources`, which is generated and never
      # committed. The empty folder satisfies the existence check for three
      # static checks; nothing here reads it.
      - name: Satisfy the resource path check
        run: mkdir -p ../build/linux-resources

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
