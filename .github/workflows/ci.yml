name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything in CI runs against the deterministic fake AI providers.
  APUNTA_FAKE_AI: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      # The eval's own positive control. Fake mode does not measure the model —
      # it measures whether the scorer can still see a fabrication at all. A
      # blind harness and a clean model produce the same table, so this step
      # fails when the canned notes stop tripping F1, F6 and H4.
      - name: Eval harness self-check
        run: npm run eval -- --fake --runs 1 > /dev/null

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        # The report is diagnostic only; an unavailable artifact service must
        # not turn an otherwise green validation run red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore
